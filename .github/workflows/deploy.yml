name: deploy

# A merge into staging deploys staging; a merge into production deploys production once approved
# (the production environment requires a reviewer). "Run workflow" re-deploys a branch.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  qa:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: qa
    if: github.ref_name == 'staging' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ github.ref_name == 'production' && 'https://18-139-77-227.sslip.io' || 'https://staging.18-139-77-227.sslip.io' }}

    steps:
      # The key's forced command on the server runs `uphsl-deploy <branch>`; it can do nothing else.
      - name: Run uphsl-deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$HOST"

      - name: Health check
        run: >-
          curl -fsS -o /dev/null --retry 6 --retry-delay 5 --retry-all-errors
          "${{ github.ref_name == 'production' && 'https://18-139-77-227.sslip.io' || 'https://staging.18-139-77-227.sslip.io' }}/up"
