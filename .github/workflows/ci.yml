name: ci

# Runs on every pull request, and from deploy.yml before every deploy.
on:
  pull_request:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    services:
      # Same major version as the server's MySQL.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: uphsl_credential_tracker_testing
          MYSQL_USER: uphsl_tracker
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: uphsl_tracker
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: composer qa

